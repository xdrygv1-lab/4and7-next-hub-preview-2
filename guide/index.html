<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>신입 가이드 · 4&7 NEXT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* 레이아웃: 왼쪽 메뉴(6개) + 오른쪽 본문. 좁은 화면에서는 메뉴가 위로 접힘 */
:root{
  --bg:#f3f4f2; --panel:#ffffff; --ink:#1b2321; --sub:#5d6a66; --line:#dde2df;
  --accent:#1d5c55; --accent-ink:#ffffff; --tint:#e6efec; --warn:#a1560f; --bad:#a32d2d; --good:#2d6b3a;
  --f-body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--panel:#1a201e;--ink:#e3e9e6;--sub:#9aa8a3;--line:#2b3431;--accent:#6fb7aa;--accent-ink:#0f1513;--tint:#1f2b28;--warn:#e3a35f;--bad:#ef8a8a;--good:#7cc58a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--panel:#1a201e;--ink:#e3e9e6;--sub:#9aa8a3;--line:#2b3431;--accent:#6fb7aa;--accent-ink:#0f1513;--tint:#1f2b28;--warn:#e3a35f;--bad:#ef8a8a;--good:#7cc58a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
a{color:var(--accent)}
[hidden]{display:none!important}
.shell{position:relative;display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s}
.shell.collapsed{grid-template-columns:0 minmax(0,1fr)}
.shell.collapsed aside{visibility:hidden;padding-inline:0;border:0}
.toggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:30;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:18px;line-height:1}
.shell:not(.collapsed) .toggle{left:226px}
.toggle:hover{background:var(--tint)}
@media(max-width:860px){.shell{grid-template-columns:1fr}.shell.collapsed{grid-template-columns:1fr}.shell:not(.collapsed) .toggle{left:auto;right:12px}.toggle{left:auto;right:12px}.shell.collapsed aside{display:none}}
@media (prefers-reduced-motion:reduce){.shell{transition:none}}
aside{border-right:1px solid var(--line);background:var(--panel);padding-block:20px;padding-inline:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;min-width:0;display:flex;flex-direction:column}
@media(max-width:860px){aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;padding-inline:8px}
.brand b{font-size:20px;letter-spacing:-.01em}.brand span{font-family:var(--f-mono);font-size:11px;color:var(--sub);letter-spacing:.08em}
.built{font-size:12px;color:var(--sub);margin-bottom:12px;padding-inline:8px}
nav{display:flex;flex-direction:column;gap:3px}
.navl{display:block;padding:8px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:600}
.navl .nd{display:block;font-size:12px;font-weight:400;color:var(--sub);line-height:1.4;margin-top:1px}
.navl:hover{background:var(--tint)}.navl.on{background:var(--accent);color:var(--accent-ink)}.navl.on .nd{color:inherit;opacity:.8}
.navs{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 12px;padding-left:8px;border-left:2px solid var(--line)}
.navs .navl{font-size:14px;font-weight:500;padding:6px 10px}
.navs .navl.on{background:var(--tint);color:var(--accent);font-weight:700}
.navfoot{margin-top:auto;padding:18px 8px 0;font-size:12.5px;color:var(--sub)}
.navfoot a{color:var(--sub);text-decoration:none}.navfoot a:hover,.navfoot a.on{color:var(--accent);text-decoration:underline}
@media(max-width:860px){.navl .nd{display:none}.navfoot{margin-top:10px}}
main{padding-block:28px 60px;padding-inline:clamp(16px,4vw,56px);min-width:0}
main.toolmode{padding:0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-inline:60px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
@media(max-width:860px){.toolbar{padding-inline:16px 60px}}
.toolbar b{font-size:15px}
.toolpanel{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px}
.toolpanel .cbox{max-width:760px}
.frame{width:100%;height:calc(100vh - 54px);border:0;display:block;background:var(--bg)}
@supports(height:100dvh){.frame{height:calc(100dvh - 54px)}}
@media(max-width:600px){.toolbar{flex-wrap:nowrap;padding-block:8px}.toolbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar b .pill{display:none}.toolbar .btnrow{flex-shrink:0;gap:6px}.toolbar .btn{padding:6px 10px;font-size:13px}.toolbar a.btn[target=_blank]{display:none}}
.beta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 18px;background:var(--panel)}
.beta b{color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0;align-items:center}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
.wrap{max-width:900px}
h1{font-size:28px;line-height:1.3;margin:0 0 6px;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:20px;margin:30px 0 10px;text-wrap:balance}
h3{font-size:16px;margin:22px 0 8px}
.lede{color:var(--sub);margin:0 0 20px;max-width:62ch}
.small{font-size:13px;color:var(--sub)}
.crumb{font-size:13px;color:var(--sub);margin-bottom:8px}.crumb a{color:var(--sub)}
.notice{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-radius:10px;padding:11px 14px;font-size:14px;margin:0 0 20px}
.notice b{color:var(--warn)}
/* 카드 */
.grow h2{margin:26px 0 6px}.grow .lede{margin:0 0 12px}.need .card b{font-size:16px}.need .card .now{color:var(--mute,#6b7570);font-size:13px}.need .card ul{margin:6px 0 0;padding-left:1.1em}.need .card li{margin:3px 0}.need .card .gain{margin-top:8px;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}.howto{counter-reset:st;display:grid;gap:10px;margin:0 0 14px}.howto>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 50px;position:relative}.howto>div:before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:13px}.ex{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}.ex code{white-space:normal;font-family:inherit;font-size:13px;background:var(--panel2,#eef3f1);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:0 0 18px;counter-reset:fl}.flow .st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}.flow .st h3{margin:0 0 6px;font-size:16px}.flow .st h3:before{counter-increment:fl;content:counter(fl);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;margin-right:8px}.flow .st dl{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;margin:0;font-size:13.5px}.flow .st dt{color:var(--mute,#6b7570)}.flow .st dd{margin:0}.flow .st .up{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);font-size:13px}.demo figure{margin:0 0 26px}.demo figure img{width:100%;height:auto;border:1px solid var(--line);border-radius:12px;display:block;background:#fff}.demo figcaption{margin:8px 2px 0;font-size:14.5px}.demo figcaption b{display:block;font-size:16px;margin-bottom:2px}.demo .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.demo-hero{display:flex;flex-direction:column;gap:2px;margin:0 0 16px;padding:16px 18px;border-radius:14px;text-decoration:none;background:var(--panel);color:var(--ink);border:2px solid var(--accent)}.demo-hero .k{font-size:12.5px;color:var(--sub)}.demo-hero b{font-size:19px;color:var(--accent)}.demo-hero span:last-child{font-size:14px;color:var(--sub)}.demo-hero:hover{background:var(--panel2,#eef3f1)}.fold{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 16px;margin:0 0 14px}.fold summary{cursor:pointer;padding:12px 0;list-style:revert}.fold summary span{color:var(--sub);font-size:13.5px;margin-left:4px}.fold[open]{padding-bottom:14px}.needlist{display:grid;gap:6px}.needlist div{display:flex;gap:10px;font-size:14px}.needlist b{min-width:78px}.needlist span{color:var(--sub)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:0 0 20px}
.cards.four{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:600px){.cards.four{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);min-width:0}
.card:hover{border-color:var(--accent)}
.card .k{font-size:12px;font-weight:600;color:var(--accent)}
.card b{font-size:18px}.card span{font-size:14px;color:var(--sub)}
.card.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.card.main span,.card.main .k{color:inherit;opacity:.85}
.card .cnt{font-family:var(--f-mono);font-size:12px;color:var(--sub);margin-top:auto;padding-top:6px}
.card ul{margin:6px 0 0;padding-left:18px;font-size:14px;color:var(--ink)}.card li{margin:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.chip{display:inline-block;font:inherit;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;text-align:left}
.chip:hover{border-color:var(--accent);color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tw{overflow-x:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:13px;background:var(--tint)}
code{font-family:var(--f-mono);font-size:13px;background:var(--tint);padding:1px 5px;border-radius:4px}
pre{background:var(--tint);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
pre code{background:none;padding:0}
blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--accent);background:var(--tint);border-radius:0 8px 8px 0}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--ink);min-width:0}
a.row:hover{border-color:var(--accent)}
.row .t{min-width:0;overflow-wrap:anywhere}.row .d{font-family:var(--f-mono);font-size:12px;color:var(--sub);white-space:nowrap}
.steps{counter-reset:s;padding-left:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:34px;margin:8px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;display:grid;place-items:center;font-weight:600}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--sub);font-weight:500}
.pill.bad{color:var(--bad)}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 문서 읽기 */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3.5vw,40px);min-width:0;font-size:16px;line-height:1.75}
.doc>*:not(.tw):not(details){max-width:68ch}
.doc h1{font-size:25px;margin-bottom:14px}
.doc h2{font-size:19px;margin:2.2em 0 .7em;padding-top:1.1em;border-top:1px solid var(--line);position:relative}
.doc h2::before{content:"";position:absolute;top:-1px;left:0;width:36px;height:3px;background:var(--accent);border-radius:2px}
.doc h3{font-size:16.5px;margin:1.6em 0 .5em}
.doc ul,.doc ol{padding-left:1.3em}.doc li{margin:.3em 0}
.doc img{max-width:100%}
.doc blockquote.glance{border:0;border-radius:12px;background:var(--tint);padding:16px 18px;font-size:17px;line-height:1.7;margin:4px 0 20px}
.doc blockquote.glance p{margin:0}
.doc blockquote.say{position:relative;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);border-radius:4px 14px 14px 14px;padding:24px 14px 8px;margin:12px 0}
.doc blockquote.say::before{content:"말하기 예시";position:absolute;left:14px;top:5px;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.doc blockquote.say p{margin:.2em 0}
.doc tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--tint) 55%,transparent)}
.doc .tw{border:1px solid var(--line);border-radius:10px}
.doc .tw table{font-size:14.5px;min-width:540px}.doc .tw th:first-child,.doc .tw td:first-child{padding-left:12px}
.doc .tw tr:last-child td{border-bottom:0}
.doc li.task{list-style:none;margin-left:-1.3em;display:flex;gap:10px;align-items:flex-start;padding:4px 0}

.doc li.task input:checked{background:var(--accent)}
.doc li.task input:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.doc li.task.done{color:var(--sub);text-decoration:line-through}
.doc .warnl{color:var(--warn);font-weight:500}

.doc details.orig .tw table{font-size:13px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:12px}

.cbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}

.cform input,.cform select,.cform textarea,.sitgrid input,.sitgrid select,.askf textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.cform textarea{min-height:120px;resize:vertical;margin-top:10px}

.etabs{display:flex;gap:6px;margin:8px 0 0}.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

else setTimeout(function(){var i=document.getElementById('g47p');if(i)i.focus()},50);

  check(p,'new').then(function(ok){if(ok===false){m.style.color='#c0392b';m.textContent='비밀번호가 맞지 않아요.';return}
    if(ok===null){m.style.color='#c0392b';m.textContent='연결하지 못했어요. 잠시 후 다시 시도해 주세요.';return}

<script>
const DOCS=[{"id": "da308dcb2", "short": "가이드북 목차", "title": "지점원 기본 가이드북", "text": "# 지점원 기본 가이드북\n\n> **한눈에** 보험용어, 청약서 작성, 허브 메뉴별 쓰는 법을 한 묶음으로 정리한 안내서입니다. 본업을 하며 보험을 함께 다루는 지점원, 특히 보험이 처음인 분을 위한 출발점입니다.\n\n## 무엇이 들어 있나요\n\n| 번호 | 내용 |\n|---|---|\n| 01 | 보험용어 사전: 꼭 필요한 용어를 묶음별로 쉬운 설명과 예시로 |\n| 03 | 청약서 작성 가이드: 체크리스트, 작성 순서, 자주 하는 실수, 심사 대비 |\n| 04 | 영업 흐름 한 장 요약: PS → TA → AP → PC → 계약 → 소개·사후관리 |\n| 메뉴 | 메뉴별 쓰는 법: 업체 분석, 재정심사·청약, 상품 자료 받기, AP 롤플레이, 보험 MBTI, 물어보기, 고치기 (이 문서 아래) |\n| 트랙 | 노세대 트랙, 신세대 트랙(체크리스트·첫 30일·도구) |\n\n## 나에게 맞는 트랙 고르기\n\n두 트랙은 **내용 기준은 같고 보는 방식만 다릅니다.**\n\n| 이런 분이라면 | 추천 트랙 |\n|---|---|\n| 출력해서 형광펜 치며 보는 게 편하다 | 노세대 트랙 |\n| 체크리스트와 예시를 먼저 보고 싶다 | 신세대 트랙 |\n| AP 스크립트 생성기·시뮬레이터를 써 볼 생각이 있다 | 신세대 트랙 |\n\n**노세대 트랙**\n1. 핵심요약을 A4로 출력합니다(2~3쪽).\n2. 모르는 단어는 용어 사전에서 찾습니다.\n3. 첫 청약 전에는 청약 가이드의 \"청약 전 체크리스트\" 1쪽만 들고 갑니다.\n\n**신세대 트랙**\n1. \"첫 30일 할 일\" 체크리스트부터 시작합니다.\n2. 용어는 사전에서 검색합니다.\n3. AP 전에는 **AP 스크립트 생성기**, 경정기 비교에는 **경정기 시뮬레이터**를 씁니다.\n4. 고객에게 보여줄 숫자는 반드시 **실제 가입설계서**로 확인합니다.\n\n## 메뉴별 쓰는 법 한눈에\n\n| 언제 | 메뉴 | 한 줄 |\n|---|---|---|\n| 첫 미팅(AP) 전 | 업체 분석 → 제안 준비 | 업체 숫자를 넣으면 분석 보고서, 컨셉, AP 스크립트, 제안 준비까지 |\n| 제안 금액이 나온 뒤 | 재정심사 → 청약 | 보험사별 가능 금액 계산, 이번 청약에 필요한 서류만 체크 |\n| 자료가 필요할 때 | 공부하기 › 상품 자료 받기 | 안내장··청약 서식 내려받기 |\n| 연습하고 싶을 때 | 연습하기 (AP 롤플레이 · 보험 MBTI) | AI 대표님과 말로 연습, 내 영업 성향 알기 |\n| 궁금할 때 | 공부하기 › 물어보기 | 업체 상황을 적고 AI에게 컨셉·준비할 것 묻기 |\n| 틀린 곳을 봤을 때 | 바로 고치기 · AI에게 가르치기 | 누구나 고치고 보탤 수 있음 |\n\n## 업체 분석 → 제안 준비\n\n1. 맨 위 «업체 불러오기»에 회사명이나 사업자번호를 넣고 불러옵니다. 재무제표 글자를 붙여넣거나 파일을 넣어도 됩니다. 읽은 숫자는 꼭 눈으로 확인합니다.\n2. 빈칸(대표 나이, 자녀, 관계, 특이사항)을 채웁니다. 생년월일을 넣으면 보험나이와 다음 상령일이 나옵니다.\n3. «분석 시작»을 누르고 아래 순서로 봅니다.\n\n| 순서 | 보는 것 |\n|---|---|\n| ① 업체 분석 | 이슈 신호등 8가지, 회사 가치 추정, 맞는 컨셉 1~3순위 |\n| ② 첫 미팅(AP) | 15단계 스크립트, 금지어 검사, 대략 점수 |\n| ③ 제안(PC) | 제안 순서·계산·반론·클로징, 금액 세 안, PPT |\n| ④ 마무리 | 최종 점검, AI가 다시 다듬은 문구 |\n\n- 스크립트의 `[ ]`는 대표님께 물어서 받을 숫자입니다. 지어서 채우지 않습니다.\n- 스크립트에는 상품 이름을 쓰지 않습니다. 금지어가 들어가면 경고가 뜹니다.\n\n## 재정심사 → 청약\n\n- **재정심사 계산기:** 나이·성별·소득·지분·설립연도·3년 순이익·기존 계약을 넣으면 메트라이프·KB라이프·신한라이프별 가능 금액과 «어디서 먼저 막히는지»가 나옵니다. 업체 분석에서 넣은 숫자는 자동으로 채워집니다(제안 금액 탭 «이 숫자로 재정심사 한도 확인»).\n- **청약 체크리스트:** 보험사·상품·계약 형태를 고르면 이번 청약에 해당하는 항목만 남습니다.\n- **상품 자료실:** 상품마다 요약·주의할 점·준법 유효기간. 파일은 «자료 받기 →»로 넘어갑니다.\n- 계산기 숫자는 미리 보기용입니다. 고객에게는 선심사와 가입설계서 기준으로 말합니다.\n\n## 상품 자료 찾고 받기\n\n안내장··약관·청약 서식은 왼쪽 메뉴 **공부하기 › 상품 자료 받기** 한 곳에 모여 있습니다.\n\n1. **공부하기 › 상품 자료 받기**를 누릅니다. 처음 한 번은 팀 비밀번호를 넣습니다.\n2. 위쪽에서 보험사(메트라이프·한화생명·KB라이프·신한라이프·삼성생명)를 고릅니다. 검색창에 상품 이름 일부만 쳐도 됩니다.\n3. 상품을 누르면 그 상품 자료가 펼쳐집니다. 파란 **내려받기**를 누릅니다.\n\n| 이럴 때 | 여기로 |\n|---|---|\n| 상품 안내장·가 필요하다 | 보험사 → 상품 → 내려받기 |\n| 청약 서식·매뉴얼이 필요하다 | 보험사를 고른 뒤 맨 아래 «서식·매뉴얼·공통 자료» |\n| 상품 내용부터 보고 싶다 | 상품 이름 옆 «상품 요약 →» |\n| 상품 자료실을 보다가 파일이 필요하다 | 상품 카드의 «자료 받기 →» |\n| 기간이 지난 자료는 빼고 보고 싶다 | «준법 기간 지난 자료 숨기기» 켜기 |\n\n- 고객에게 보여 주는 것은 **고객용** 표시가 붙은 자료뿐입니다. **내부·교육용**은 공부용이라 고객에게 전달하지 않습니다.\n- 여기 없는 자료가 있으면 «자료 올리기»로 올려 주세요. **고객 개인정보가 든 파일(제안서·청약서 등)은 올리지 않습니다.**\n\n## AP 롤플레이\n\n1. 메뉴 «연습하기 › AP 롤플레이»를 누릅니다. 업체 분석 스크립트 탭의 «이 업체로 AP 롤플레이 연습»으로 들어와도 됩니다.\n2. 모드를 고릅니다.\n - **AI가 대표:** 내가 세무사가 되어 AP를 연습합니다.\n - **AI가 설계사:** 내가 대표가 되어 거절해 보고, AI가 어떻게 받아 내는지 배웁니다.\n3. 관계(기장·소개·초면), 난이도, 대표 성향, 업체 정보를 고릅니다. «업체 분석에 넣은 업체 불러오기»로 채울 수 있습니다.\n4. 글로 쓰거나 «말하기»를 눌러 말로 합니다(크롬·엣지). AI 답은 소리로도 읽어 줍니다.\n5. «끝내고 피드백»을 누르면 AP 15단계 채점표로 총점, 단계별 근거, 잘한 점, «이렇게 말해 보세요», 다음 과제가 나옵니다.\n\n## 보험 MBTI\n\n1. 메뉴 «연습하기 › 보험 MBTI». 52문항, 9분쯤 걸립니다.\n2. 결과로 16가지 유형 중 내 유형, 나와 잘 맞는 업체와 연습할 것, 함께 다니면 좋은 «동행 짝꿍» 유형이 나옵니다.\n3. «팀 기록에 저장»을 눌러야 지점장이 함께 봅니다. 누르지 않으면 내 브라우저에만 남습니다.\n4. 3개월 뒤 다시 해 보면 바뀐 점을 볼 수 있습니다.\n\n## 물어보기 · 경정기 비교 계산기\n\n- **물어보기(공부하기 아래):** 업체 상황(업종, 매출, 순이익, 대표 나이)을 적고 질문합니다. 답과 함께 참고한 컨셉 문서가 나옵니다. 고객 이름·회사명은 쓰지 않습니다.\n- **경정기 비교 계산기(공부하기 아래):** 대표 나이·성별·금액을 넣으면 상품별 보험료와 환급률을 비교합니다. 파란 글씨는 추정값입니다.\n\n## 바로 고치기 · AI에게 가르치기\n\n- 문서 위 **바로 고치기**로 누구나 고칠 수 있고, 저장하면 바로 모두에게 반영됩니다.\n- **AI에게 가르치기**로 틀린 곳, 더 좋은 화법, 익명 사례(업종·규모·나이대·결과만)를 보내면 매일 밤 AI가 읽고 반영합니다.\n\n## 표기 규칙\n\n| 표기 | 뜻 | 어떻게 쓰나 |\n|---|---|---|\n| **[확정]** | 약관·사업방법서 등 공식 기초서류에서 확인 | 최신판인지 확인 후 사용 |\n| **[확인필요]** | 미확정이거나 자료끼리 다르거나 회사별로 다름 | 고객에게 말하기 전 지점장·원수사에 확인 |\n| **[일반지식, 확인필요]** | 업계 일반 지식으로 적은 내용 | 참고만 |\n| **(세무사 검토 필요)** | 세무 처리 관련 문구 | 단정 금지, 세무 판단을 거칠 것 |\n\n## 모든 문서 공통 원칙\n- **수익을 약속하는 말 금지:** \"확정 수익\", \"무조건 남는다\", \"원금 보장\" 등. 보장성 보험은 저축 상품이 아닙니다.\n- 세무 처리(비용처리·손금·익금 등)는 세무사 검토 사항입니다.\n- 고객 화면의 숫자는 **실제 가입설계서**가 기준입니다. 가이드북 수치는 2026년 9~10월 기준 예시입니다.\n- 특정 고객·지점원의 개인정보와 실적은 담지 않았습니다.\n\n## 업데이트 기준\n\n| 항목 | 다음 확인 시점 |\n|---|---|\n| 상품 조건 | 상품 개정 시(변액 경정기 MAVERICK **2026.10.20** 출시 예정) |\n| 경정기·단기납종신 비교 수치 | 매월 |\n| 재정심사 기준 예시 | 보험사 공지 시 |\n| 세무 문구 | **2027.1.1** 시행 세법 개정분 반영 시 |\n\n수정 요청은 지점 단톡방에 \"가이드북 수정: 문서명 / 내용\" 형식으로 남겨 주세요.\n\n## 꼭 확인할 것\n- [ ] [확인필요] 표시 내용은 고객 안내 전 확인했다\n- [ ] 고객에게 보여줄 숫자는 실제 가입설계서로 맞췄다\n- [ ] 세무 관련 문구는 세무사 검토를 거쳤다"}, {"id": "df6611838", "short": "핵심요약", "title": "지점원 핵심요약 (출력용)", "text": "# 지점원 핵심요약 (출력용)\n\n> **한눈에** 노세대 트랙용 A4 2~3쪽 요약입니다. 큰 그림, 꼭 알아야 할 20개, 청약 가는 날 챙길 것만 담았습니다.\n\n## 1쪽. 큰 그림\n- 본업으로 대표님의 문제를 먼저 풀고, 해결 수단 중 하나로 보험을 제안합니다. 보험은 **마지막 한 칸**입니다.\n- 주로 다루는 보험: **경영인정기보험**(대표 유고 대비, 퇴직금 재원 설계), **종신보험**(상속세 재원, 가족 보장, 목적자금)\n- 영업 순서: 발굴(PS) → 전화약속(TA) → 첫 미팅(AP) → 제안(PC) → 계약(C) → 소개·사후관리\n- 첫 미팅 목표는 **다음 약속과 소개**. 상품 이름은 꺼내지 않고, 제안 전 **선심사**부터.\n\n## 2쪽. 꼭 알아야 할 20개\n\n| 번호 | 용어 | 한 줄 |\n|---|---|---|\n| 1 | 계약자·피보험자·수익자 | 내는 사람(법인)·보장 대상(대표)·받는 사람(법인) |\n| 2 | 서면동의 | 대표 자필 서면동의 없으면 **계약 무효** |\n| 3 | 해약환급금 | 중간 해지 때 돌려받는 돈, 낸 돈보다 적을 수 있음 |\n| 4 | 환급률 | 돌려받는 돈 ÷ 낸 돈. 100% 미만이면 원금 손실 |\n| 5 | 저해약환급금형 | 경정기 **3년 전 0%, 3~5년 50%** |\n| 6 | 체증형 | 경정기 **10년 후 매년 10%** 증가 |\n| 7 | 감액완납 | 납입 멈추고 보장 줄여 유지, **5년** 후 |\n| 8 | 종신전환 | **7년** 이상 유지 후, 기존 해지·그때 나이 요율 적용 |\n| 9 | 보험계약대출 | **10년** 이내, 대표 **75세** 이하 |\n| 10 | 달러보험 | 환율 하락 시 원화 손실 가능, 장점만 말하면 불완전판매 |\n| 11 | 고지의무 | **청약서에 글로** 적어야 효력 |\n| 12 | 일반 vs 간편 | 간편은 약 **20%** 비쌈, 2년 내 질병 사망 시 **50%** |\n| 13 | 재정심사 | 고지소득은 보험료·직업과 맞아야 함 |\n| 14 | 상품 한도 ≠ 심사 한도 | 실제 금액은 재정심사로 결정 |\n| 15 | 세무 처리 | 세무 처리(비용처리·손금·익금 등)는 세무사 검토 사항 |\n| 16 | 세금 | 없어지는 게 아니라 **뒤로 미뤄지는 것**(세무사 검토 사항) |\n| 17 | 세무 문구 | 단정하지 않고 세무사 검토로 안내 |\n| 18 | 대표 명의 이전 | 평가 기준 없음, **확정 제안 금지** |\n| 20 | 하지 말 것 | 수익 약속, 가입 대가 현금, 컨설팅 대가로 묶기, 해지 전제 판매 |\n\n## 3쪽. 청약 가는 날 챙길 것\n\n**출발 전**\n- [ ] 선심사 결과, 실제 가입설계서 출력\n- [ ] 원수사 작성예시에 형광펜, 한 번 더 검증\n- [ ] 보험료 출금일 확인\n\n**대표님께 받을 것**\n- [ ] 청약서 서명·법인인감 날인, 부속서류·주주명부 날인\n- [ ] 법인인감증명서 원본\n- [ ] 사업자등록증·법인등기부등본·법인통장·대표 신분증 사본\n\n**함께 확인할 것**\n- [ ] 5년 이내 암 진단, 2년 이내 수술·입원(청약서에 직접)\n- [ ] 저해약 구간(3년 전 0%), 달러 상품이면 환율 위험\n- [ ] 고객보관용 서류 전달, \"보험사에서 확인 전화가 갑니다\" 안내\n\n**청약 후**\n- [ ] 첫 출금 확인, 그 사이 안부 연락\n- [ ] 증권은 방문 전달하며 보장 점검\n- [ ] 청약철회: 증권 받은 날부터 **15일** 이내(청약일부터 **30일** 넘으면 불가), 상품마다 다를 수 있음\n\n모르면: 지점장, 원수사 매니저\n\n## 꼭 확인할 것\n- [ ] 법인계약 서류 최종 목록을 보험사 기준으로 확인했다\n- [ ] 세무 설명은 세무사 검토 사항으로 안내했다\n- [ ] 청약철회 기간을 상품별로 확인했다"}, {"id": "df4a45ab3", "short": "빠른 시작", "title": "신세대 트랙: 빠른 시작", "text": "# 신세대 트랙: 빠른 시작\n\n> **한눈에** 체크리스트와 예시, 도구 중심으로 빠르게 시작하는 지점원용 안내입니다. 첫 30일 할 일부터 따라 하면 됩니다.\n\n**핵심 4줄**\n1. AP 결과물은 계약이 아니라 **다음 약속 + 소개**\n2. 제안 전 **선심사**, 고객 화면 숫자는 **실제 가입설계서**\n3. 세무 처리는 세무사 검토 사항\n4. 수익 약속 표현 금지\n\n## 첫 30일 할 일\n\n| 주차 | 할 일 |\n|---|---|\n| 1주차 기초 | 표기 규칙 읽기, 용어 사전 A·B 묶음 훑기, 원수사 전산 접속 확인 |\n| 1주차 숫자 | 경정기 핵심 숫자: 저해약 **3년 0% / 3~5년 50%**, 감액완납 **5년**, 종신·연금전환 **7년**, 대출 **10년·75세**, 10년 후 매년 **10%** 체증 |\n| 2주차 명단 | 기장 거래처 법인 위주 **20~30명** 가망고객 목록(업종·잉여금·핵심이슈·접근명분·관계온도 A/B/C 등), 접근명분 고르기(가결산·결산, 법인전환, 성실신고 후 점검), TA **3건** 이상 |\n| 3주차 AP | 전날 **AP 스크립트 생성기**로 초안, 15단계 20분 구조 숙지(진입 5분·전개 7분·전환 3분·정보수집 3분 30초·클로징 1분 30초), 끝에 **일자+시각+소요시간** 약속 확정, 녹음 피드백 |\n| 4주차 제안·청약 | 선심사 → 재정심사 범위 확인, **경정기 시뮬레이터**로 후보 비교 → 실제 설계서, PC 자료(AP 복기 → 전/후 → A/B안 → D-day), 첫 청약은 선배와 동행 |\n\n## 예시로 이해하기\n\n**1억 보장, 10년 뒤 순비용**\n\n| 상품 | 월보험료 | 10년 총납입 | 10년 환급금 | 순비용 |\n|---|---|---|---|---|\n| 타사 경정기 A | 412,000원 | 4,944만 | 4,736만 | **208만** |\n| TheClassic 달러 | 515,200원 | 6,182만 | 5,867만 | **315만** |\n| TheClassic 원화 | 367,000원 | 4,404만 | 3,990만 | **414만** |\n\n- 달러형은 가입금액 **$10만**(약 1.4억, 환율 1,400원 가정)이라 보장금액이 다릅니다.\n- 원화형은 환급률은 낮지만 보험료가 가장 낮아 \"같은 예산으로 보장 최대화\"에 맞습니다.\n\n**일반 vs 간편 (40세, 1억):** 달러 515,200원 → 623,000원(**+21%**), 원화 367,000원 → 440,000원(**+20%**). 같은 예산이면 보장 약 **17%** 감소, 2년 내 질병 사망 시 50%.\n\n**70세 이상 대표:** 경정기 10년 환급률이 **60%대**로 떨어져, 종신·상속형 검토가 맞습니다.\n\n## 금지어 vs 대체 표현\n\n| 쓰지 않는 말 | 대신 이렇게 |\n|---|---|\n| 세무 효과를 단정하는 말 | 처리 방식은 세무사와 결정합니다 |\n| 전환하면 세금 없이 넘어가요 | 세무 처리는 세무사 검토 사항입니다 |\n| 확정 수익 / 무조건 남아요 / 저축이에요 | 보장성 보험입니다. 중도 해지 시 원금 손실이 있을 수 있습니다 |\n| 10년 뒤 95% 돌려받아요(먼저 꺼내기) | 완납·유지 전제, 환급률은 설계서 기준 |\n| 달러라서 안전해요 | 환율이 내리면 원화 기준 손실이 날 수 있습니다 |\n| 상속세 최고 40% | 현행 최고세율 **50%**(최신 세법 확인) |\n\n## 도구 활용\n\n| 도구 | 한 줄 사용법 |\n|---|---|\n| AP 스크립트 생성기 | 상황카드 입력 → 컨셉 진단 + 15단계 초안. 실제 파악한 정보만 |\n| 경정기 시뮬레이터 | 나이·성별·심사·금액 → 상품별 환급률·순비용 비교 |\n| 용어 사전 | 검색으로 찾기 |\n\n- ⚠ 도구 수치는 **내부 검토용**, 고객 자료는 실제 가입설계서\n- 시뮬레이터의 40·50·60·70세 외 나이는 **추정값**\n- 고객 실명·주민번호는 넣지 않기, \"OO산업 김 대표님\" 수준으로 익명화\n\n## 막히면\n\n| 상황 | 볼 곳 |\n|---|---|\n| 용어 | 보험용어 사전 |\n| 청약서 작성 | 청약 가이드 → 원수사 작성예시 → 지점장 |\n| 고객 거절 | 화법·반론처리 모음 |\n| 세무 질문 | 세무사 검토 |\n\n## 꼭 확인할 것\n- [ ] AP 끝에 일자+시각+소요시간까지 약속을 잡았다\n- [ ] 고객에게 보여줄 숫자는 실제 가입설계서로 확인했다\n- [ ] 도구에 개인정보를 넣지 않았다"}, {"id": "d2b6fbd38", "short": "영업 흐름", "title": "영업 흐름 한 장 요약", "text": "# 영업 흐름 한 장 요약\n\n> **한눈에** 가망고객 발굴부터 계약, 소개·사후관리까지 영업 전체 흐름을 한 장 표로 정리했습니다. 각 단계의 목표 하나와 꼭 할 것, 하지 말 것만 보면 됩니다.\n\n핵심 문장: **\"보험을 먼저 말하지 않는 사람, 그러나 마지막 한 칸을 비워두지 않는 사람.\"**\n\n## 단계별 한 장 표\n\n| 단계 | 목표 | 꼭 할 것 | 하지 말 것 |\n|---|---|---|---|\n| **PS** 발굴 | 만날 사람 확보 | 가망고객 **20~30명** 상시 유지, 관계온도 A/B/C 기록. 진입 타이밍은 결산·가결산 미팅 | 명단만 적고 방치 |\n| **TA** 전화약속 | 미팅 확약 | 만날 명분을 판다. 이지선다로 일정 잡기, **3분** 이내 | 전화로 상품 설명 |\n| **AP** 초회면담 | **다음 약속 + 소개** | AP 15단계(**20분**). 질문으로 니즈 끌어내기. 고객 입에서 나온 숫자만 근거 | 상품명·환급률·수수료 언급(채점 **−5점**) |\n| 선심사 | 가입 가능 여부 | PC 전에 선심사·재정심사 범위 확인 | 가입 안 되는 금액으로 제안 |\n| **PC** 제안 | 해결책 제시 | AP 복기 → 전/후 비교 → 숫자 시뮬레이션 → A안/B안 → 마지막 장 D-day 일정 | \"하실래요?\"(고민하게 만듦) |\n| **C** 계약 | 청약 | 할 것을 전제로 서류 일정 질문 후 기다리기. 청약 당일 동행 | 침묵을 못 견뎌 먼저 금액 깎기 |\n| 소개·사후관리 | 관계 유지·추가 계약 | 계약 순간·AP 직후·성과 시점에 소개 요청. 증권 전달 때 보장분석, 3개월 차 관리, 결산 1개월 전 브리핑 | 계약 후 연락 끊기 |\n\n## 이렇게 말해 보세요\n> \"화요일 오후와 목요일 오전 중 어느 쪽이 덜 번잡하시겠습니까?\"\n\n> \"오늘 말씀을 바탕으로 다음번에 해오겠습니다.\"\n\n> \"이번 달에 서류가 들어가야 합니다. 서류는 언제까지 준비 가능하실까요?\"\n\n## 숫자로 보는 깔때기\n- AP 후 계약 비율 약 **15%**, 7개를 보면 1개 성사 → 계약 1건에 **AP 약 7건**이 필요합니다.\n\n## 전문직 지점원은 주도형으로\n- ⚠ 대가형(\"이걸 해드렸으니 보험 들어주세요\")은 고액 계약이 어렵고 \"억지로 가입한 보험\"으로 남습니다.\n- 주도형: 용역을 충분히 제공하고, 보험이 독립적으로 가치 있을 때 별도로 제안합니다.\n- 보험은 컨설팅 대가가 아니라 **구조상 필요한 재원**으로 설명합니다.\n\n## 도구\n\n| 도구 | 언제 | 주의 |\n|---|---|---|\n| AP 스크립트 생성기 | AP 전, 컨셉 진단과 15단계 스크립트 초안 | 실제 파악한 정보만 입력, 개인정보 최소화 |\n| 경정기 시뮬레이터 | PC 준비, 상품별 환급률·순비용 비교, 재정심사 참고 | 기준 나이(40·50·60·70세) 외는 추정값 |\n| Claude 스킬 | \"AP 스크립트 만들어줘\", \"AP 녹음 분석해줘\" | 사용법은 지점장·개발팀 안내에 따름(확인 필요) |\n\n## 꼭 확인할 것\n- [ ] PS 명단을 20~30명으로 유지하고 있다\n- [ ] AP에서 상품명·환급률·수수료를 말하지 않았다\n- [ ] PC 전에 선심사·재정심사 범위를 확인했다\n- [ ] 고객에게 보여줄 수치는 실제 가입설계서로 확인했다\n- [ ] 계약 후 소개 요청과 사후관리 일정을 잡았다"}, {"id": "d20eb592a", "short": "보험용어 사전", "title": "보험용어 사전", "text": "# 보험용어 사전\n\n> **한눈에** 지점원이 꼭 알아야 할 보험용어를 7개 묶음으로 나눠 한 줄 뜻과 예시로 정리했습니다. 모르는 단어가 나오면 검색해서 바로 찾아 쓰세요.\n\n⚠ 예시 숫자는 2026년 9~10월 자료 기준입니다. 고객에게 보여줄 숫자는 반드시 **실제 가입설계서**로 확인합니다.\n\n## A. 계약 구조\n\n| 용어 | 쉬운 뜻 | 예 |\n|---|---|---|\n| 계약자 | 계약하고 보험료 내는 사람(법인). 해지·변경 권한 보유 | 법인 경정기: 계약자 = 법인 |\n| 피보험자 | 생명·건강이 보험 대상인 사람 | 법인 경정기: 피보험자 = 대표 |\n| 수익자 | 보험금을 받는 사람 | 법인 경정기: 수익자 = 법인. 유족 지정 시 처리 달라짐(세무사 검토) |\n| 타인의 사망보험·서면동의 | 계약자≠피보험자면 피보험자 서면동의 필수, 없으면 무효 | 대표 자필 서명 필수 |\n| 서면동의 철회 | 피보험자가 동의를 철회하면 계약 해지 | 대표 교체·지분 분쟁 가능 법인은 미리 안내 |\n| 주계약 / 특약 | 상품 본체 / 덧붙이는 옵션(자동부가 포함) | 종신전환·연금전환특약 자동부가 |\n| 보험가입금액 | 보장의 기준 금액 | 달러 경정기 일반 **5만~500만달러** |\n| 보험기간 / 납입기간 | 보장 기간 / 내는 기간. 같으면 \"전기납\" | **90세** 만기, 90세납 |\n| 보장개시일 | 보장 시작일. 첫 보험료 내면 승낙 전 사고도 원칙적 보장 | 첫 출금일 미리 확인 |\n| 계약자 변경 | 계약자를 바꾸는 것, 회사 승낙 사항 | 법인 → 대표는 확정 제안 금지(세무사 검토) |\n| 지정대리청구 | 수익자가 청구 못 할 때 지정 대리인이 청구 | 사망보험금 제외 |\n| 보험증권 | 계약 성립 증서, 청약철회 기간 기준 | 전달 때 보장분석 함께 |\n\n## B. 보험료·환급\n\n| 용어 | 쉬운 뜻 | 예 |\n|---|---|---|\n| 해약환급금 | 중도 해지 때 돌려받는 돈, 낸 돈보다 적을 수 있음 | 40세 남 일반 1년차 **0달러** |\n| 환급률 | 해약환급금 ÷ 낸 보험료. 100% 미만이면 원금 손실 | 40세 일반 10년 **94.9%** |\n| 순비용 | 낸 보험료 − 해약환급금 = 보장 비용 | 1억 보장 10년 상품별 **208만~414만** |\n| 유해약환급금형 | 환급금을 정상 지급하는 기준형, 주로 비교용 | \"비교 안내용\" |\n| 저해약환급금형 | 일정 기간 환급금을 줄이고 보험료가 쌈 | 3년 전 **0%**, 3~5년 **50%**, 5년~납입 끝 **95%**, 납입 후 **100%** |\n| 무해약환급금형 | 납입 중 환급금 0%, 보험료 가장 쌈 | 납입 중 **0%**, 납입 후 **50%** |\n| 체증형 | 시간이 지나면 사망보험금 증가 | 10년 후 매년 **10%** / 매년 **5%** 150%까지 / 매년 **20%** 30년 후 700% |\n| 단기납 | 5·7·10년 짧게 내는 종신 | 5년납 40세 남 10년 **124.9%** |\n| 유지보너스 | 납입 후 유지하면 더해 주는 보너스, 해지 시 없음 | 10년 **7.5%**, 20년 **3.8%** / **39.7%** |\n| 적용이율 | 계산·적립용 이율. \"수익률\" 아님 | 달러 10년 내 **3.75%**, 이후 1.0% / 원화 **2.5%**, 이후 1.0% |\n| 계약자적립액 | 계약별 적립금, 환급금 계산 기초 | 대출 원금·이자 빼고 계산 |\n| 감액 | 가입금액 줄이기, 줄인 부분은 해지로 봄 | 감액분 환급금이 적을 수 있음 |\n| 감액완납 | 납입 멈추고 환급금으로 금액 줄여 유지 | 계약 **5년** 경과 후, 회사 승낙 |\n| 보험계약대출 | 환급금 범위 내 대출, 이자 붙고 보험금에서 차감 | 전기납 + 10년 미경과 + **75세** 이하 |\n| 추가납입 | 기본보험료 외 추가 납입, 상품마다 다름 | 일반 추가납입 규정 없음(원화고정납입용만) |\n| 중도인출 | 해지 없이 적립액 일부 인출 | 자동인출 외 불가 |\n| 원화고정납입 | 달러 상품을 매달 같은 원화로 납입 | 추가보험료 한도 **50%** |\n| 원화환산납입·지급 | 달러 상품을 원화로 내고 받는 특약 | 환율 리스크는 남음 |\n| 플러스보험기간 | 달러 경정기 90세 만기 후 **5년** 연장 보장 | 대출 잔액만큼 줄어듦 |\n| 종신전환 | 경정기를 종신으로 전환(기존 해지 후 일시납) | **7년** 이상 정상 유지 후 |\n| 연금전환 | 계약을 연금으로 전환 | 7년 경과 + 환급금 **1,000만원(1만달러)** 이상 |\n| 조기 계약전환 | 사유 발생 시 7년 전에도 종신 전환 | 36회 이상 납입 + 폐업·3개월 입원·대표 변경·최대주주 변경 |\n| 납입최고·실효 | 연체 시 **14일** 이상 독촉 후 해지 | 최고 기간 다음 날 해지 |\n| 부활 | 연체 해지 계약을 되살림, 재심사 | 해지일부터 **3년** 이내 |\n| 선납 | 보험료 미리 내기 | **12개월**, 일부 회사 6개월 |\n| 납입유예 | 출산·육아휴직 때 납입 잠시 미룸 | 계약당 1회, 6개월 또는 12개월 |\n| 보험가격지수 | 업계 평균 대비 가격, 높을수록 비쌈 | 일반 **100.2%**, 간편 **121.2%** |\n\n## C. 심사\n\n| 용어 | 쉬운 뜻 | 예 |\n|---|---|---|\n| 고지의무 | 건강·직업 등을 청약서에 **서면으로** 사실대로 알림. 구두는 효력 없음 | 질문을 대표와 하나씩 확인 |\n| 고지의무 위반 | 고의·중과실 시 해지·보장 제한, 일정 기간 후 해지 불가 | 설계사 고지 방해는 설계사 책임 |\n| 일반심사 | 질문 자세하고 엄격, 보험료 쌈 | 원화 경정기 40세 1억 월 **36.7만원** |\n| 간편심사 | 질문 줄여 가입 쉬움, 보험료 비쌈 | 같은 조건 월 **44만원**(약 20%↑) |\n| 간편가입 2년 50% | 2년 내 질병 사망 시 보험금 **50%**만 | 고령 고객에 먼저 고지 |\n| 간편가입 3개월 규칙 | 일반 가능자는 비교 설명 + 확인서 필요, 3개월 내 일반으로 갈아타면 무효 가능 | 일반가입 이력 확인 |\n| 건강진단 | 금액·나이에 따라 검진 요구, 진단 지원 계약은 청약철회 불가 | 진단 일정까지 계산 |\n| 선심사 | PC 전에 가입 가능 여부 먼저 확인 | 제안 전 선심사가 원래 순서 |\n| 언더라이팅 | 받을지, 어떤 조건으로 받을지 정하는 심사 전체 | 건강 + 재정 + 직업 |\n| 재정심사 | 보험료 납부 능력, 보장 규모 적정성 심사 | 소득서류·재무제표 요구 가능 |\n| 재정질의서 | 소득·재산을 적어 내는 질문지 | 기계약 합산 5억 초과~7억 이하 예시 |\n| 고지소득 | 고객이 스스로 적는 소득, 보험료와 맞아야 함 | ⚠ 월납 100만원에 월소득 100만원 고지 금지 |\n| 피보험이익 | 사망 시 경제적 손실 크기, 한도 근거 | 40~49세 연소득 × **30배** 예시 |\n| 기계약 합산 | 기존 계약 사망보험금을 합쳐 심사 | 5억 이하면 고지소득만으로 예시 |\n| 동업사 합산한도 | 업계 전체 가입 합계 상한 | 50억 초과 시 소득서류 예시 |\n| 상품 가입한도 | 상품 최고 금액, **재정심사 한도와 다름** | 50억원이어도 실제는 재정심사로 결정 |\n| 법인 업력 요건 | 설립 짧은 법인은 제한 | 2년 미만 **5억** 이하·월납 **300만** 이하 예시(회사별 확인 필요) |\n| 특별조건부 인수 | 할증·보장 제한 조건부 인수 | 일반가입형에만 |\n| 조인 분할계약 확인 | 두 설계사 분할 시 합산 인수 여부 사전 확인 | 한쪽만 인수되면 분쟁 |\n\n## D. 상품\n\n| 용어 | 쉬운 뜻 | 예 |\n|---|---|---|\n| 보장성 보험 | 위험 보장 목적, 저축 상품 아님 | \"저축·재테크 목적 아님\" |\n| 정기보험 | 정해진 기간만 보장, 만기 환급 없음 | 90세 만기 환급금 0 |\n| 종신보험 | 평생 사망 보장 | 상속세 재원·가족 보장 |\n| 단기납 종신 | 짧게 내고 이후 환급률 상승 | 7년납 + 3년 유지(7+3) |\n| 원금형 종신 | 일정 기간 뒤 환급률이 원금 수준 | 7년차 **100%** 예시 |\n| 체증형 종신 | 사망보험금이 해마다 증가 | 자산이 늘어나는 오너의 상속재원 |\n| 보장형(무해약) 종신 | 환급금 줄이고 사망보험금 레버리지 ↑ | 사망보험금이 확실히 필요할 때 |\n| 달러보험 | 기준 통화가 달러, **환율 하락 시 원화 손실 가능** | 장점만 말하면 불완전판매 |\n| 변액보험 | 펀드 운용, 원금 손실 가능 | 공시 수익률 ≠ 개인 수익률 |\n| 변액유니버셜 | 변액 + 납입·인출 유연성 | 최소의무납입 **36개월** |\n| 최저사망보험금 보증 | 기본 사망보험금 보증, 환급금은 보증 안 함 | 환급금 최저보증 없음 |\n| 변액 경정기(MAVERICK) | **2026.10.20** 출시 예정, 세부 미공개 | 출시 전엔 기존 경정기 기준 상담(확인 필요) |\n| 연금보험 | 일정 나이부터 연금 수령 | 경정기·종신에서 전환 가능 |\n| 무배당 | 계약자 배당 없음 | 대부분 현재 상품 |\n| 예금자보호 | 보험사 파산 시 일정액 보호, 변액 특별계정은 제외될 수 있음 | 1인당 **1억원** |\n\n## E. 세무\n\n세무 처리(비용처리·손금·익금 등)는 세무사 검토 사항입니다. 아래는 개념만 알아 두세요.\n\n| 용어 | 쉬운 뜻 | 예 |\n|---|---|---|\n| 법인세상 비용·수익·자산 처리 | 보험료와 환급금을 장부에 어떻게 올릴지 | 세무 처리는 세무사 검토 사항 |\n| 원금형 종신 법인 처리 | 세무사 검토 사항 | 단정 금지 |\n| 종신전환 시 처리 | 세무사 검토 사항 | ⚠ \"전환하면 세금 없이 넘어간다\" 금지 |\n| 퇴직 시점 매칭 | 세무사 검토 사항 | 정관·임원퇴직급여지급규정 정비가 먼저 |\n| 규정 개정 | 세무사 검토 사항 | 개정 시점·소급 리스크 확인 |\n| 임원 퇴직소득 한도 | 퇴직소득 인정 한도, 2020년 이후분 **2배수**, 초과분 근로소득 | 대표 개인 세부담 별도 계산 |\n| 가입 중 대표 근로소득 | 계약자·수익자가 법인이면 대표 근로소득 아님 | 유족 수익자면 달라짐 |\n| 계약 이전 평가 | 법인 → 대표 이전 시 평가 기준 미확정 | **확정 제안 금지**, 사전답변 검토 |\n| 부당행위계산 | 특수관계인에게 싸게 넘기면 부인(차액 **3억원** 또는 시가 **5%** 이상) | 초기 환급금으로 낮게 넘기는 설계 위험 |\n| 달러보험 환산 | 법인 달러보험 환차 처리 해석 없음 | 추가 확인 필요 |\n| 사전답변 | 거래 전 국세청 해석 받기, 수개월 소요 | 고액·새 구조일 때 |\n| 상속세 최고세율 | 현행 **50%**, 40% 표기는 정정 대상 | 최신 세법 확인 |\n\n## F. 컴플라이언스\n\n| 용어 | 쉬운 뜻 | 예 |\n|---|---|---|\n| 환산보험료(RD) | 실적 비교용 환산 보험료 | 환산 비율(확인 필요) |\n| 특별이익 제공 금지 | 가입 대가로 이익 제공 금지 | ⚠ 보험을 컨설팅 대가로 묶지 말 것 |\n| 확인서 | 컨설팅 대가로 가입하지 않는다는 확인서 | 최신 양식(확인 필요) |\n| 완전판매 / 불완전판매 | 위험 포함 충분히 설명 / 그렇지 못함 | 해지 전제·환급률 먼저 설득은 위험 |\n| 완전판매모니터링 | 청약 후 설명 이해 확인 절차 | 작성예시로 한 번 더 검증 |\n| 해피콜 | 청약 후 보험사 확인 전화 | 대표에게 미리 안내 |\n| 청약철회 | 일정 기간 내 계약 취소 권리 | 증권 받은 날부터 **15일**, 청약일부터 **30일** 넘으면 불가 |\n| 전문금융소비자 | 상장법인 등, 청약철회 불가 | 주권상장법인 계약자 |\n| 품질보증해지 | 서류 미전달·설명 누락·자필 누락 시 취소 가능 | 회사별 기간(확인 필요) |\n\n## G. 영업 흐름\n\n| 용어 | 쉬운 뜻 | 예 |\n|---|---|---|\n| PS | 가망고객 발굴·명단 관리 | **20~30명** 상시 유지 |\n| TA | 약속 잡는 통화, 만날 명분을 판다 | 이지선다로 일정 제시 |\n| AP | 첫 미팅, 산출물은 **다음 약속과 소개** | 상품명 꺼내면 **−5점** |\n| PC | 해결책을 숫자로 제안 | A안 / B안 |\n| C | 청약 받기 | 서류 준비 일정 질문 |\n| F.F | 질문으로 사실 정보 수집 | 고객이 말한 숫자만 근거 |\n| 선거절처리 | 거절 이유를 먼저 꺼내 풀기 | 단점을 먼저 말해 두기 |\n\n## 꼭 확인할 것\n- [ ] 고객에게 보여줄 숫자는 실제 가입설계서로 확인했다\n- [ ] 상품 가입한도와 재정심사 한도를 구분했다\n- [ ] 간편가입 2년 50% 규칙을 먼저 알렸다\n- [ ] 세무 관련 내용은 세무사 검토를 거쳤다\n- [ ] (확인 필요) 항목은 지점장에게 확인했다"}, {"id": "d3383ce3a", "short": "청약서 작성", "title": "청약서 작성 가이드", "text": "# 청약서 작성 가이드\n\n> **한눈에** 청약 전 체크리스트, 작성 순서, 자주 하는 실수, 심사 대비, 청약 후 관리를 정리했습니다. 첫 청약을 앞둔 지점원이 출력해서 들고 가는 용도입니다.\n\n⚠ 회사별 전산 화면·서류 양식·전자청약 절차는 자료에 없습니다. 최종 기준은 원수사 확인이 필요합니다(확인 필요).\n\n## 1. 청약 전 체크리스트\n\n**상품·심사**\n- [ ] **선심사를 먼저** 넣었다(설명 다 했는데 가입 안 되는 상황 방지)\n- [ ] 일반/간편 선택 이유를 설명했다. 간편은 보험료 약 **20%** 높고, 같은 예산이면 보장 약 **17%** 줄어든다\n- [ ] 일반 가능자를 간편으로 넣으면 **보험료 비교 설명 + 계약자 확인서** 준비\n- [ ] 청약 직전 **3개월** 내 일반심사 가입 이력 확인(있으면 일반가입형 재심사)\n- [ ] 간편가입 **2년 내 질병 사망 시 50%** 지급을 고지했다\n- [ ] 가입나이·상품 정식명칭을 설계 시스템에서 재확인했다(예: 달러 경정기 일반 남 **20~70세** / 간편 **30~75세**)\n- [ ] 법인 **설립 2년 미만** 여부 확인(회사별 인수 제한, 확인 필요)\n- [ ] 조인(분할) 계약이면 원수사에 **합산 인수 가능 여부** 먼저 확인\n\n**고지의무**\n- [ ] 고지는 **청약서에 서면으로**. 말로 한 것은 효력 없음\n- [ ] 대표와 질문을 하나씩 읽었다: **5년 이내 암 진단, 2년 이내 수술·입원**\n- [ ] 간편심사도 \"병력이 해소되셨습니까\"까지 확인\n- [ ] ⚠ 고지를 줄이거나 빼라고 권하지 않았다. 책임은 설계사에게 돌아온다\n\n**재정심사**\n- [ ] 소득서류가 필요한 구간인지 확인(기계약 합산, 회사 기준)\n- [ ] 고지소득이 **월납 보험료·직업과 앞뒤가 맞는지** 확인\n- [ ] 요구받지 않은 서류를 **셀프 제출하지 않았다**(제출 서류는 모두 검토 대상)\n- [ ] 경정기 재정심사 기준은 자료가 없어 원수사 언더라이팅팀에 직접 확인(확인 필요)\n\n**설명 자료**\n- [ ] **실제 가입설계서** 출력, 1쪽 \"저축·재테크 목적의 상품이 아닙니다\" 문구를 함께 읽음\n- [ ] 저해약 구간(**3년 전 0%, 3~5년 50%**) 설명\n- [ ] 달러 상품이면 **환율 하락 시 원화 손실 가능·환전 비용** 설명\n- [ ] 세무 처리는 세무사 검토 사항으로 안내\n- [ ] 보험사 내부 교육용 자료를 캡처해 보여 주지 않았다\n\n## 2. 법인계약 서류 (최종 목록은 원수사 기준)\n\n| 서류 | 비고 |\n|---|---|\n| 사업자등록증 사본 | |\n| 법인등기부등본 | 발급일 기준(확인 필요) |\n| 주주명부(법인인감 날인) | |\n| 법인인감증명서 **원본** | 3개월 이내 참고 |\n| 법인 통장 사본 | 보험료 출금 계좌 |\n| 대표 신분증 사본 | |\n| 고객거래확인서 | 자금세탁방지 관련(확인 필요) |\n| 위임장·재직증명서 | 임직원 대리 청약 시 |\n| 이사회 의사록(경영인 유고 대비) | 필수 여부(확인 필요), 세무사 검토 사항 |\n| 정관(임원 정년·퇴직금 규정) | 세무사 검토 사항 |\n\n## 3. 자금 원천·고액 거래\n\n| 기준 | 내용 | 상태 |\n|---|---|---|\n| 고액현금거래 | 1거래일 **1천만원** 이상 현금 거래 자동보고 | 확인 필요 |\n| 외화 환전 | 1일 **1만불** 초과 통보, **2만불** 초과 취득경위 입증 | 규정 수시 변경, 확인 필요 |\n| 납부 주체 | 계약자가 법인이면 법인 통장에서 출금 | 확정 |\n| 자녀 계약자 | 자녀가 실제로 보험료를 부담해야 함 | 확인 필요 |\n| ⚠ \"현금 원천을 만든다\" 표현 | 자금 원천 조사·증여 쟁점 소지 | 사용 금지 권장 |\n\n## 4. 작성 순서\n1. 실제 가입설계서로 상품·가입금액·납입기간·심사유형 확정\n2. 원수사 매니저에게 **작성예시**를 받아 형광펜 표시 후 연습, 한 번 더 검증\n3. 매니저 사전 질문: 불완전판매 주의점, 제출 방법, 출금일, 병력, 원화고정납 금액, 계약자·피보험자 기재\n4. 청약 당일 **지점원 직접 동행**\n5. 기재: 계약자 = 법인(인감), 피보험자 = 대표(서명), 수익자 = 법인\n6. 고지의무: 피보험자가 직접 읽고 답하고 서명\n7. 피보험자 **서면동의(자필 서명)**, 없으면 계약 무효\n8. 상품설명서·확인서 서명, 고객보관용 서류 전달\n9. 부속서류·주주명부 날인, 인감증명서 원본·사본 서류 수령\n10. 첫 보험료 법인통장 출금 확인\n11. 원본 서류 발송 또는 전산 제출(방법 확인 필요)\n12. 해피콜·완전판매모니터링 안내\n\n## 5. 자주 하는 실수\n\n| 실수 | 예방 |\n|---|---|\n| 건강 이력을 말로만 듣고 안 적음 | 청약서에 서면 고지 |\n| 고지소득을 보험료보다 낮게 적음 | 월납 대비 소득 확인 |\n| 직업과 안 맞는 고소득 고지 | 직업·소득 일치 확인 |\n| 요구 안 한 재무서류 셀프 제출 | 요구받은 서류만 |\n| 간편 가입 시 비교 설명 누락 | 비교 설명 + 확인서 |\n| 피보험자 서면동의 누락(무효) | 대표 자필 서명 확인 |\n| 환급률·\"원금 회복\"으로 먼저 설득 | 보장 목적 먼저, 완납 전제 |\n| 달러 장점만 설명 | 환율 손실 가능성 고지 |\n| \"절판\" 이유로 서둘러 청약 | 고객이 이해·준비된 뒤 청약 |\n| 조인 합산 인수 미확인 | 원수사 사전 확인 |\n| 근거 없는 실무 메모 그대로 따름 | 원수사 지침으로 확인 |\n| 계약자·피보험자 칸 바꿔 기재 | 작성예시와 대조 |\n| 사용인감 날인 | 인감증명서와 대조 |\n\n## 6. 심사 대비\n\n⚠ 아래는 한 보험사 **종신 계열** 재정심사 예시이며 경정기 기준이 아닙니다. 현재 적용 여부는 확인 필요입니다.\n\n**고지소득 인수 구간 예시**\n\n| 대상 | 기계약 합산 | 심사 | 소득서류 |\n|---|---|---|---|\n| 비체증형·체증형 종신 | **5억** 이하 | 고지소득 | 불필요 |\n| 체증형 종신 | **5억 초과~7억** 이하 | 재정질의서 | 불필요 |\n| 법인 설립 2년 미만 | 가입금액 **5억** 이하 & 월납 **300만** 이하 | | 불필요 |\n\n**사망보험금 인정범위 예시(연간소득 배수)**\n\n| 나이 | 일반고객 | 상위 등급 |\n|---|---|---|\n| 39세 이하 | 30배 | 35배 |\n| 40~49세 | 25배 | 30배 |\n| 50~59세 | 15배 | 20배 |\n| 60세 이상 | 10배 | 15배 |\n\n- 예: 45세, 연소득 1억원 → 상위 등급 기준 **30억원**까지. 실제 인수는 기계약·건강심사에 따라 다름\n- ⚠ 하지 말 것: 보험료 대비 부족한 소득 고지 / 셀프 서류 제출 / 신빙성 없는 소득 고지 / 동업사 합산 **50억** 초과 시 소득서류 필요\n- 상품 한도(달러 경정기 일반 **500만달러**·간편 **200만달러**, 원화 일반 **50억원**·간편 **30억원**, 65세 초과 **20억원**)는 **재정심사 한도가 아닙니다.** 배수·업력 기준은 원수사 확인(확인 필요)\n- 재정심사 범위 내 가입이 세무 쪽 방어선이기도 합니다.\n\n## 7. 청약 후 관리\n\n| 항목 | 내용 |\n|---|---|\n| 청약철회 | 증권 받은 날부터 **15일** 이내, 청약일부터 **30일** 넘으면 불가. 상품별로 \"30일\" 표기도 있음(확인 필요) |\n| 철회 불가 | 건강진단 지원 계약, 전문금융소비자(상장법인 등), 30일 초과 |\n| 해피콜·완판모니터링 | 대표에게 미리 안내(회사별 시기·방식 확인 필요) |\n| 품질보증해지 | 서류 미전달·설명 누락·자필 누락 시 취소 가능(기간 확인 필요) |\n| 첫 납입까지 케어 | 대표가 불안해하는 기간에 연락 |\n| 증권 전달 | 한 달 뒤쯤 방문 전달, 보장분석 |\n| 연체 | **14일** 이상 납입최고 후 해지, **3년** 내 부활 가능(재심사) |\n| 변경 시점 | 감액완납 5년 / 계약대출 10년 이내·75세 이하 / 종신·연금전환 7년 / 조기전환 36회 + 사유 |\n| 사후관리 | 3개월 차, 결산 1개월 전 브리핑, 2년 후 재방문 |\n\n## 꼭 확인할 것\n- [ ] 회사별 전산 화면 순서, 전자청약 가능 여부, 원본 발송처\n- [ ] 회사별 법인 필수 서류와 발급일 기준\n- [ ] 경정기 재정심사 기준(매출·순이익·자본 배수, 업력, 합산)\n- [ ] 해피콜·완판모니터링 시기, 품질보증해지 기간\n- [ ] 고객거래확인서 기준, 외화 환전 최신 규정\n- [ ] 청약철회 기간 상품별 차이"}];

  el.querySelectorAll('table').forEach(tb=>{const w=document.createElement('div');w.className='tw';tb.parentNode.insertBefore(w,tb);w.appendChild(tb)});
  let first=true;
  el.querySelectorAll('blockquote').forEach(b=>{if(first&&/한눈에/.test(b.textContent.slice(0,20)))b.classList.add('glance');else b.classList.add('say');first=false});
  el.querySelectorAll('li,p').forEach(n=>{if(/^\s*⚠/.test(n.textContent))n.classList.add('warnl')});
  const key='hub-chk:'+id;let saved=[];try{saved=JSON.parse(store.get(key)||'[]')}catch(e){}
  el.querySelectorAll('li input[type=checkbox]').forEach((cb,i)=>{cb.disabled=false;cb.removeAttribute('disabled');const li=cb.closest('li');li.classList.add('task');cb.checked=saved.includes(i);li.classList.toggle('done',cb.checked);
    cb.addEventListener('change',()=>{li.classList.toggle('done',cb.checked);const all=[...el.querySelectorAll('li.task input')];store.set(key,JSON.stringify(all.map((x,j)=>x.checked?j:-1).filter(j=>j>=0)))})});
  const hs=[...el.querySelectorAll('h2')];const toc=$('#toc');toc.innerHTML='';
  if(hs.length>=3){toc.innerHTML=hs.map((h,i)=>{h.id='sec-'+i;return `<button class="chip" type="button" data-sec="${i}">${esc(h.textContent)}</button>`}).join('');
    toc.onclick=e=>{const b=e.target.closest('[data-sec]');if(b){const t=document.getElementById('sec-'+b.dataset.sec);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}}}
  const n=el.textContent.replace(/\s+/g,'').length;$('#rtime').textContent=`읽는 시간 약 ${Math.max(1,Math.ceil(n/500))}분`}
function show(){const id=location.hash.slice(1);const i=Math.max(0,DOCS.findIndex(d=>d.id===id));const d=DOCS[i];
  $('#nav').innerHTML=DOCS.map((x,j)=>`<a href="#${x.id}" class="${j===i?'on':''}">${j+1}. ${esc(x.short)}</a>`).join('');
  const el=$('#doc');el.innerHTML=md(d.text);enhance(el,d.id);document.title=d.short+' · 신입 가이드';
  const p=DOCS[i-1],q=DOCS[i+1];
  $('#next').innerHTML=(p?`<a href="#${p.id}"><small>← 이전</small>${esc(p.short)}</a>`:'')+(q?`<a href="#${q.id}" style="text-align:right"><small>다음 →</small>${esc(q.short)}</a>`:'');
  if(location.hash)window.scrollTo(0,0)}
window.addEventListener('hashchange',show);show();
</script>
