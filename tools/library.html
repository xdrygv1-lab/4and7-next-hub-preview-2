<!doctype html>
<html lang="ko">
<head>
<script src="embed.js"></script>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 자료실 | 4&amp;7 NEXT</title>
<style>
@font-face{font-family:'Freesentation';src:url('../fonts/Freesentation-4Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Freesentation';src:url('../fonts/Freesentation-7Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Inter';src:url('../fonts/Inter-Variable.ttf') format('truetype');font-weight:100 900;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('../fonts/Paperlogy-7Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{
  --page:#06070a; --card-d:#14161c; --card:#F7F7F7; --ink:#0a0b0d; --sub:#5b616e; --sub-d:#a8acb3;
  --line-d:#22262e; --line:#e2e4e8; --blue:#0052FF; --blue-l:#4d8bff; --red:#E5322D;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:#fff;font-family:'Inter','Freesentation',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 16px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand{font-size:14px;color:var(--sub-d)}
h1{font-family:'Paperlogy','Freesentation',sans-serif;font-weight:700;font-size:34px;line-height:1.2;margin:6px 0}
.lead{color:var(--sub-d);margin:0;max-width:760px}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;border:1px solid var(--line-d);border-radius:100px;padding:6px 14px;font-size:14px;color:var(--sub-d);text-decoration:none;background:transparent;cursor:pointer;font-family:inherit;transition:border-color .25s var(--ease),background .25s var(--ease),color .25s var(--ease)}
.chip:hover,.chip.on{border-color:var(--blue-l);background:rgba(0,82,255,.14);color:#fff}
/* 경고 */
.alerts{background:var(--card-d);border:1px solid var(--red);border-radius:18px;padding:14px 18px;margin-bottom:16px}
.alerts h2{font-size:15px;margin:0 0 6px}
.alerts ul{margin:0;padding-left:18px;color:#e7e9ec;font-size:14px}
/* 필터 */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.filters .grp{display:flex;gap:6px;flex-wrap:wrap}
.filters input[type=search]{font:inherit;font-size:15px;background:var(--card-d);color:#fff;border:1px solid var(--line-d);border-radius:100px;padding:7px 14px;min-width:220px;flex:1}
.filters input[type=search]:focus{outline:2px solid var(--blue);outline-offset:1px}
.filters label.tg{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub-d)}
.count{font-size:13px;color:var(--sub-d)}
/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:14px;align-items:start}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:18px 18px 14px;border-left:5px solid var(--bar,#999)}
.card .ins{font-size:13px;color:var(--sub)}
.tgrp{margin:6px 0}.tgrp summary{cursor:pointer;font-weight:600;font-size:14px;padding:4px 0}
.card h3{margin:2px 0 6px;font-size:18px;line-height:1.35}
.pill{display:inline-block;border-radius:100px;padding:2px 10px;font-size:12px;font-weight:700;margin:0 6px 6px 0}
.p-sale{background:var(--blue);color:#fff}
.p-new{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.p-stop{background:var(--red);color:#fff}
.p-unknown{background:#fff;color:var(--sub);border:1.5px solid #b7bbc3}
.p-kind{background:#e9ebee;color:var(--sub)}
.one{font-size:14px;margin:4px 0 10px}
table.kv{width:100%;border-collapse:collapse;font-size:13.5px}
table.kv th{text-align:left;font-weight:500;color:var(--sub);padding:6px 8px 6px 0;vertical-align:top;width:30%;white-space:nowrap}
table.kv td{padding:6px 0;vertical-align:top}
table.kv tr+tr{border-top:1px solid var(--line)}
.uw{margin:10px 0 0;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.uw a{color:var(--blue)}
details.more{margin-top:10px}
details.more summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--blue);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'+ ';}
details.more[open] summary::before{content:'- ';}
h4{font-size:13px;color:var(--sub);margin:12px 0 4px}
ul.l{margin:0;padding-left:18px;font-size:13.5px}
ul.l.warn li{color:var(--red)}
ul.docs{list-style:none;margin:0;padding:0;font-size:13px}
ul.docs li{border-top:1px solid var(--line);padding:7px 0;display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:start}
ul.docs li:first-child{border-top:0}
.dt{font-size:11px;border-radius:100px;padding:1px 8px;white-space:nowrap;background:#e9ebee;color:var(--sub)}
.dt.cust{background:rgba(0,82,255,.1);color:var(--blue)}
.dt.priv{background:var(--red);color:#fff}
.dm{grid-column:2 / 4;font-size:12px;color:var(--sub);word-break:break-all}
.dm .exp{color:var(--red);font-weight:700}
.dm .soon{color:#b45309;font-weight:700}
.cp{border:1px solid var(--line);background:#fff;border-radius:100px;font:inherit;font-size:11px;padding:1px 8px;cursor:pointer;color:var(--sub)}
.cp:hover{border-color:var(--blue);color:var(--blue)}
section.common{background:var(--card);color:var(--ink);border-radius:18px;padding:18px 20px;margin-top:18px}
section.common h2{font-family:'Paperlogy','Freesentation',sans-serif;font-size:20px;margin:0 0 6px}
section.common h3{font-size:14px;color:var(--sub);margin:14px 0 4px}
.empty{color:var(--sub-d);padding:20px 0}
footer{margin-top:28px;font-size:13px;color:var(--sub-d);border-top:1px solid var(--line-d);padding-top:16px}
@media (max-width:640px){h1{font-size:28px}.filters input[type=search]{min-width:0;width:100%}}
@media print{body{background:#fff;color:#000}.nav,.filters{display:none}.alerts{background:#fff;color:#000}.alerts ul{color:#000}.card,section.common{border:1px solid #ccc;break-inside:avoid}details.more{display:block}}
.team{background:#fff;color:#0a0b0d;border:1px solid #dee1e6;border-radius:20px;padding:16px 18px;margin:14px 0;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.team .chip{color:#0a0b0d;background:#fff;border:1px solid #dee1e6}.team .chip.on{background:#0052FF;border-color:#0052FF;color:#fff}.team .tl,.team .tcount{color:#5b616e}
.tg2>*{min-width:0}.tg2 input,.tg2 select{width:100%;box-sizing:border-box;background:#fff;color:#0a0b0d}
.team .th{display:flex;justify-content:space-between;align-items:center;gap:8px}.team h2{margin:0;font-size:18px}.tcount{font-size:13px;color:var(--sub,#6b7280);font-weight:400}
.team .tl{font-size:13px;color:var(--sub,#6b7280);margin:6px 0 8px}
.tg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.tg2 label{display:flex;flex-direction:column;font-size:13px;gap:3px}
.tg2 input,.tg2 select{font:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line,#d1d5db);border-radius:10px}
.tchk{display:block;font-size:13px;margin:8px 0}.tbtn{display:flex;gap:10px;align-items:center}#tMsg{font-size:13px}
.tfiles{list-style:none;padding:0;margin:6px 0 0}.tfiles li{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;padding:4px 0;border-top:1px dashed var(--line,#e5e7eb)}
.tfiles .tm{color:var(--sub,#6b7280);font-size:12px;width:100%}.tfiles button{font:inherit;font-size:12px;border:1px solid var(--line,#d1d5db);background:none;border-radius:100px;padding:2px 9px;cursor:pointer}
.tfiles button.dl{background:#0052FF;color:#fff;border-color:#0052FF}
.dlgo{display:inline-block;margin-top:10px;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;font-size:14px;border-radius:100px;padding:7px 16px}.dlgo span{font-weight:400;opacity:.85}.dlgo:hover{filter:brightness(1.1)}
.alerts summary{cursor:pointer}.card.hit{box-shadow:0 0 0 3px var(--blue-l)}
</style>
</head>

<!-- 4&7 NEXT 입구 비밀번호 (build_site.py가 모든 페이지 body 맨 앞에 넣음. ../config.json = config.json 경로) -->
<div id="g47" style="position:fixed;inset:0;z-index:2147483000;background:#0a0b0d;display:grid;place-items:center;font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif">
  <form id="g47f" style="background:#fff;border:0;border-radius:24px;padding:28px 26px;width:min(340px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.06)">
    <div style="font-weight:800;font-size:20px;color:#0a0b0d">4&amp;7 NEXT</div>
    <div style="color:#5f6b66;font-size:14px;margin:6px 0 16px">팀 비밀번호를 넣어 주세요. 한 번 넣으면 이 기기에서 기억합니다.</div>
    <input id="g47p" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" style="width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #dee1e6;border-radius:12px;font-size:16px">
    <button type="submit" style="margin-top:12px;width:100%;padding:11px;border:0;border-radius:100px;background:#0052FF;color:#fff;font-size:15px;font-weight:700;cursor:pointer">들어가기</button>
    <div id="g47m" style="color:#E5322D;font-size:13px;margin-top:8px;min-height:1em"></div>
  </form>
</div>
<script>(function(){var K='team_pass',CFG='../config.json',g=document.getElementById('g47'),m=document.getElementById('g47m'),v='';
try{v=localStorage.getItem(K)||''}catch(e){}
function ep(){return fetch(CFG,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){return String(j.endpoint||'').trim()}).catch(function(){return ''})}
var dv='';try{dv=localStorage.getItem('g47dv')||'';if(!dv){dv=Math.random().toString(36).slice(2,10);localStorage.setItem('g47dv',dv)}}catch(e){}
function check(p,k){var pg=(location.pathname.split('/').filter(Boolean).pop()||'hub')+(location.hash||'').slice(0,20);return ep().then(function(e){if(!e)return null;return fetch(e+'?action=passcheck&pass='+encodeURIComponent(p)+'&k='+(k||'auto')+'&pg='+encodeURIComponent(pg)+'&dv='+dv+'&r='+Date.now()).then(function(r){return r.json()}).then(function(j){return !!j.ok}).catch(function(){return null})})}
if(v){g.style.display='none';check(v).then(function(ok){if(ok===false){try{localStorage.removeItem(K)}catch(e){}g.style.display='grid';m.textContent='비밀번호가 바뀌었어요. 다시 넣어 주세요.'}})}
else setTimeout(function(){var i=document.getElementById('g47p');if(i)i.focus()},50);
document.getElementById('g47f').addEventListener('submit',function(e){e.preventDefault();var p=document.getElementById('g47p').value.trim();if(!p)return;m.style.color='#5f6b66';m.textContent='확인 중…';
  check(p,'new').then(function(ok){if(ok===false){m.style.color='#c0392b';m.textContent='비밀번호가 맞지 않아요.';return}
    if(ok===null){m.style.color='#c0392b';m.textContent='연결하지 못했어요. 잠시 후 다시 시도해 주세요.';return}
    try{localStorage.setItem(K,p)}catch(e){}g.style.display='none';try{location.reload()}catch(e){}})});
})();</script>

<script src="../uw/library-data.js"></script>
<script>
(function(){
const L = window.LIBRARY;
const $ = id => document.getElementById(id);
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const ROOT = 'G:\\내 드라이브\\내드라이브\\양진이\\01. 리치디바인\\4&7 넥스트 개발팀\'\\5. 상품\\';
const BRAND = { '메트라이프':'#A4CE4E', '한화생명':'#F37321', 'KB라이프':'#FFBC00', '신한라이프':'#0046FF', '삼성생명':'#1428A0' };
const KIND = { ceo:'경영인정기', whole:'종신', annuity:'연금', pension:'연금저축', health:'건강' };
const STATUS = { sale:['판매 중','p-sale'], new:['신상품','p-new'], stop:['판매중단','p-stop'], unknown:['확인 필요','p-unknown'] };
const st = { ins:'전체', kind:'전체', q:'', onlySale:false };
const KEY = 'library-v1';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const days = d => Math.round((new Date(d + 'T00:00:00') - TODAY) / 864e5);

function expTag(doc){
  if (!doc.exp) return '';
  const n = days(doc.exp);
  if (n < 0) return ` · <span class="exp">준법 유효기간 만료 (${doc.exp})</span>`;
  if (n <= 60) return ` · <span class="soon">${n}일 뒤 만료 (${doc.exp})</span>`;
  return ` · 유효 ~${doc.exp}`;
}
function docRow(d){
  const cls = d.private ? 'priv' : (d.type === '고객용' ? 'cust' : '');
  const label = d.private ? '공유 금지' : d.type;
  const meta = [d.date ? esc(d.date) : '', d.approval ? '준법 ' + esc(d.approval) : ''].filter(Boolean).join(' · ');
  return `<li><span class="dt ${cls}">${esc(label)}</span><span>${esc(d.t)}</span><button class="cp" type="button" data-path="${esc(L.base + d.path)}">경로 복사</button>
    <span class="dm">${esc(L.base + d.path)}${meta ? ' · ' + meta : ''}${expTag(d)}</span></li>`;
}

function alerts(){
  const out = [];
  L.products.forEach(p => (p.docs||[]).forEach(d => {
    if (d.private) { out.push(`${p.ins} ${p.name}: "${d.t}"에 개인정보가 있음. 공유·업로드 금지`); return; }
    if (d.exp && days(d.exp) < 0 && p.status !== 'stop') out.push(`${p.ins} ${p.name}: "${d.t}" 준법 유효기간 ${d.exp} 만료. 최신본 확보 필요`);
    else if (d.exp && days(d.exp) <= 60 && days(d.exp) >= 0) out.push(`${p.ins} ${p.name}: "${d.t}" ${days(d.exp)}일 뒤 만료`);
  }));
  L.products.filter(p => p.status === 'stop').forEach(p => out.push(`${p.ins} ${p.name}: ${p.statusNote}. 신규 제안 금지`));
  $('alerts').innerHTML = out.length ? `<details><summary><b>먼저 확인할 것 ${out.length}건</b> <span style="color:var(--sub-d);font-size:13px">준법 기간 지남·판매중단 (눌러서 보기)</span></summary><ul style="margin-top:8px">${out.map(t => `<li>${esc(t)}</li>`).join('')}</ul></details>` : '';
  $('alerts').style.display = out.length ? '' : 'none';
}

function text(p){
  return [p.ins, p.name, p.oneLine, p.uw, ...(p.specs||[]).flat(), ...(p.points||[]), ...(p.cautions||[]), ...(p.check||[]), ...(p.docs||[]).map(d => d.t)].join(' ').toLowerCase();
}
function visible(p){
  if (st.ins !== '전체' && p.ins !== st.ins) return false;
  if (st.kind !== '전체' && p.kind !== st.kind) return false;
  if (st.onlySale && !(p.status === 'sale' || p.status === 'new')) return false;
  if (st.q && !st.q.toLowerCase().split(/\s+/).every(w => text(p).includes(w))) return false;
  return true;
}

function card(p){
  const [sT, sC] = STATUS[p.status];
  const specs = (p.specs||[]).map(([k,v]) => `<tr><th>${esc(k)}</th><td>${rich(v)}</td></tr>`).join('');
  const list = (arr, cls) => arr && arr.length ? `<ul class="l ${cls||''}">${arr.map(x => `<li>${rich(x)}</li>`).join('')}</ul>` : '';
  const calc = p.kind === 'annuity' ? '' : ` <a href="uw-calc.html">계산기</a>`;
  const ours = hubDocs(p);
  return `<article class="card" id="p-${esc(p.id)}" style="--bar:${BRAND[p.ins]}">
    <div class="ins">${esc(p.ins)}</div>
    <h3>${esc(p.name)}</h3>
    <span class="pill ${sC}">${sT}${p.statusNote ? ' · ' + esc(p.statusNote) : ''}</span><span class="pill p-kind">${KIND[p.kind]}</span>
    <p class="one">${esc(p.oneLine)}</p>
    <table class="kv">${specs}</table>
    <div class="uw"><b>재정:</b> ${esc(p.uw)}${calc}</div>
    ${teamBox(p.id)}
    ${ours.length ? `<div class="uw" style="margin-top:6px"><b>우리 상품 자료:</b> ${ours.map(d => `<a href="../index.html#${esc(d.id)}">${esc(d.title.replace(/^(상품 요약|요약_|FAQ|약관 정리):?\s*/, ''))}</a>`).join(' · ')}</div>` : ''}
    <details class="more"><summary>판매 포인트·주의·자료 ${(p.docs||[]).length}건</summary>
      ${p.points && p.points.length ? '<h4>판매 포인트</h4>' + list(p.points) : ''}
      ${p.cautions && p.cautions.length ? '<h4>주의</h4>' + list(p.cautions, 'warn') : ''}
      ${p.check && p.check.length ? '<h4>확인 필요</h4>' + list(p.check) : ''}
      <h4>자료</h4>${(p.docs||[]).length ? `<ul class="docs">${p.docs.map(docRow).join('')}</ul>` : '<p class="empty" style="color:var(--sub);padding:0">폴더에 자료 없음</p>'}
    </details>
  </article>`;
}

/* 허브 «공부하기»의 상품 문서와 자동 연결 (manifest.json 제목으로 찾음, 문서가 늘면 저절로 붙음). 개발팀 11/04 */
const HUB_RULE = {
  met_usd_ceo: /(The\s?Classic).*경영인정기|달러경영인정기|경영인정기보험 12개|경영인정기보험·단기납종신|전환특약/,
  met_maverick: /MAVERICK|변액리치정기|변액 경영인정기|변액보험 판매상품/,
  met_3y: /3년\s?내고\s?만족/, met_million: /백만인/, met_modu: /모두의\s?달러종신/, met_modu_krw: /모두의\s?종신|단기납종신 환급률/,
  met_odalyeon: /달러연금|오늘의 달러/,
  kb_ceo: /경영인정기보험 12개|경영인정기보험·단기납종신/, sh_ceo: /경영인정기보험 12개|경영인정기보험·단기납종신/,
  kb_partner: /단기납종신 환급률|종신보험 법인·개인/, kb_7years: /단기납종신 환급률/,
  sh_vip: /상속세 재원|종신보험 법인·개인/, sh_silsok: /단기납종신 환급률|종신보험 법인·개인/, sh_seven: /단기납종신 환급률/
};
let HUB = [];
/* ---------- 팀 자료함 (서버: Apps Script produp·prodlist·proddl·prodhide, 팀 비밀번호) ---------- */
let EP = '', TEAM = [], TEAM_ERR = '';
const TP = () => { try { return localStorage.getItem('team_pass') || ''; } catch (e) { return ''; } };
const post = o => fetch(EP, { method: 'POST', body: JSON.stringify(Object.assign({ pass: TP() }, o)) }).then(r => r.json());
function teamBox(pid){
  const n = TEAM.filter(f => f.pid === pid).length;
  return `<a class="dlgo" href="downloads.html?p=${esc(pid)}">자료 받기${n ? ` <span>${n}건</span>` : ''} →</a>`;
}
function teamLoad(){
  if (!EP || !TP()) return;
  post({ action: 'prodlist' }).then(r => { if (r.ok) { TEAM = r.items || []; render(); } }).catch(() => {});
}
fetch('../config.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}).then(c => { EP = (c && c.endpoint) || ''; teamLoad(); }).catch(() => teamLoad());
function hubDocs(p){ const re = HUB_RULE[p.id]; if (!re || !HUB.length) return []; const all = HUB.filter(d => re.test(d.title)); if (p.kind !== 'annuity') all.push(...HUB.filter(d => /청약서 작성 가이드/.test(d.title))); return [...new Map(all.map(d => [d.id, d])).values()].slice(0, 6); }
fetch('../manifest.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(m => { if (m && m.docs) { HUB = m.docs.filter(d => /^(prod|prodmet|prodguide|faq|guide|concept)$/.test(d.gid)); render(); } }).catch(() => {});

function render(){
  const ps = L.products.filter(visible);
  $('cards').innerHTML = ps.length ? ps.map(card).join('') : '<p class="empty">조건에 맞는 상품이 없습니다.</p>';
  $('count').textContent = `${ps.length} / ${L.products.length}개 상품`;
  const groups = ['공통','메트라이프','한화생명','KB라이프','신한라이프','삼성생명'].filter(g => st.ins === '전체' || g === st.ins || g === '공통');
  const q = st.q.toLowerCase();
  $('common').innerHTML = `<h2>서식·매뉴얼·청약 서류</h2><p style="margin:0">원수사별 청약서 작성법, 제지급 서식, 모니터링 스크립트는 <a class="dlgo" href="downloads.html${st.ins !== '전체' ? '?ins=' + encodeURIComponent(st.ins) : ''}">상품 자료 받기 →</a> 에 원수사별로 모아 두었습니다.</p>`;
  try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){}
}

function chips(el, values, key){
  el.innerHTML = values.map(([v, label]) => `<button type="button" class="chip ${st[key]===v?'on':''}" data-v="${esc(v)}">${esc(label)}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; st[key] = b.dataset.v; chips(el, values, key); render(); };
}

try{ Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); }catch(e){}
if (new URLSearchParams(location.search).get('p')) Object.assign(st, { ins:'전체', kind:'전체', q:'', onlySale:false });
chips($('fIns'), [['전체','전체'],['메트라이프','메트라이프'],['한화생명','한화생명'],['KB라이프','KB라이프'],['신한라이프','신한라이프'],['삼성생명','삼성생명']], 'ins');
chips($('fKind'), [['전체','모든 종류'],['ceo','경영인정기'],['whole','종신'],['annuity','연금'],['pension','연금저축'],['health','건강']], 'kind');
$('onlySale').checked = !!st.onlySale;
$('q').value = st.q || '';
$('onlySale').addEventListener('change', e => { st.onlySale = e.target.checked; render(); });
$('q').addEventListener('input', e => { st.q = e.target.value.trim(); render(); });
document.addEventListener('click', async e => {
  const b = e.target.closest('.cp'); if (!b) return;
  const full = ROOT + b.dataset.path.replace(/\//g, '\\');
  try{ await navigator.clipboard.writeText(full); b.textContent = '복사됨'; }catch(err){ b.textContent = '복사 실패'; }
  setTimeout(() => b.textContent = '경로 복사', 1500);
});
alerts(); render();
/* 자료 받기 페이지에서 «상품 요약 →» 으로 오면 그 카드로 */
const P0 = new URLSearchParams(location.search).get('p');
if (P0) { const c = document.getElementById('p-' + P0); if (c) { c.classList.add('hit'); const m = c.querySelector('details.more'); if (m) m.open = true; c.scrollIntoView({ block: 'center' }); } }
})();
